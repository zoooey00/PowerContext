<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>端知 · Edge Knowledge</title>
  </head>
  <body>
    <div class="shell">
      <aside>
        <div class="brand">◈ 端知 <small>EDGE KNOWLEDGE</small></div>
        <p class="muted">seekdb × 阶跃星辰</p>
        <div class="line"></div>
        <label
          >当前知识库<input
            id="kb"
            value="personal"
            pattern="[a-z][a-z0-9_]*" /></label
        ><label
          >已有集合<select id="collections">
            <option value="">选择已有知识库</option>
          </select></label
        ><button id="connect">打开 / 创建知识库</button
        ><label
          >模型精度<select id="profile">
            <option value="fp16">FP16 · WebGPU 优先</option>
            <option value="q8">INT8 · WASM</option>
            <option value="fp32">FP32 · 对照基线</option>
          </select></label
        ><label class="check"
          ><input id="wasm" type="checkbox" />强制 WASM（验证降级）</label
        ><label
          >批大小<select id="batch">
            <option selected>1</option>
            <option>8</option>
            <option>16</option>
          </select></label
        >
        <div class="status">
          <span id="backend">● 模型尚未加载</span>
          <p id="count">尚未连接知识库</p>
        </div>
        <p class="muted fine">
          all-MiniLM-L6-v2 · 384 维<br />英文语料效果最佳，支持 UTF-8
          文本导入。<br />文档和查询均在此设备计算向量。
        </p>
      </aside>
      <main>
        <header>
          <span class="eyebrow">LOCAL INFERENCE / DATABASE SEARCH</span>
          <h1>把资料变成可检索的知识。</h1>
          <p class="muted">本地向量化，seekdb 混合检索。每一步都有迹可循。</p>
        </header>
        <section>
          <div class="sectionhead">
            <h2>01 / 导入资料</h2>
            <span>TXT · MD</span>
          </div>
          <input
            id="files"
            type="file"
            multiple
            accept=".txt,.md,text/plain,text/markdown"
          /><textarea
            id="text"
            placeholder="也可以直接粘贴一段文本…"
          ></textarea>
          <div class="actions">
            <button id="import">向量化并导入</button
            ><button id="refresh" class="secondary">重试索引刷新</button
            ><button id="sample" class="secondary">导入示例语料</button>
          </div>
          <progress id="progress" value="0" max="1"></progress>
          <p id="status" role="status" aria-live="polite">
            准备就绪。先打开知识库，再导入资料。
          </p>
        </section>
        <section>
          <div class="sectionhead">
            <h2>02 / 检索知识</h2>
            <select id="mode">
              <option value="hybrid">混合检索 · seekdb RRF</option>
              <option value="vector">语义检索</option>
            </select>
          </div>
          <form id="search">
            <div class="searchbar">
              <input
                id="query"
                required
                placeholder="输入问题，例如 How does WebGPU accelerate inference?"
              /><button>检索</button>
            </div>
          </form>
          <p id="timing" class="muted"></p>
          <div id="results">
            <p class="empty">你的知识，将在这里连接起来。</p>
          </div>
        </section>
        <footer>
          <button id="export" class="secondary">导出本次计时日志</button
          ><span>所有排序由 seekdb 完成 · 无云端推理 API</span>
        </footer>
      </main>
    </div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
